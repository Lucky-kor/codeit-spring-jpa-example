# README의 기본 실습 환경. 애플리케이션 종료 시 메모리 DB 데이터도 사라진다.
spring:
  h2:
    console:
      enabled: true # 실행 중 http://localhost:8080/h2 에서 테이블/SQL을 확인한다.
      path: /h2
  datasource:
    url: jdbc:h2:mem:test # H2 콘솔에서도 정확히 같은 JDBC URL을 입력한다.
    username: sa
    password: '' # 로컬 학습용 H2의 빈 암호.
  jpa:
    hibernate:
      ddl-auto: create # 재시작할 때 테이블을 다시 만든다. 학습용 DB에만 사용한다.
    show-sql: true # persist/find/commit 앞뒤에 생성되는 SQL을 관찰한다.
    properties:
      hibernate:
        format_sql: true # SQL을 여러 줄로 출력해 읽기 쉽게 한다.
