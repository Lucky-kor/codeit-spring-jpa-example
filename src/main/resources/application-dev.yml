# 기존 PostgreSQL 수업 환경. 별도 DB 준비 후 --spring.profiles.active=dev 로 선택한다.
# DB 없이 복습할 때는 application-local.yml의 H2를 명시적으로 선택한다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/codeitpractice # 미리 만들어 둔 학습용 DB.
    username: admin
    password: q1w2e3r4
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create # 시작 시 기존 테이블을 재생성한다. 기존 데이터가 삭제되는 학습 설정이다.
    show-sql: true # 객체 조작이 어떤 SQL로 바뀌는지 확인한다.
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true # SQL을 수동 활성화했을 때 엔티티 테이블 생성 후 실행한다.
  sql:
    init:
      mode: always # api 단원의 MemberDataRunner를 기본 사용한다. data.sql은 PostgreSQL 수업 참고용이다.
      data-locations: classpath:data.sql
      continue-on-error: false # SQL을 수동 실행할 경우 초기화 실패를 감추지 않는다.
